name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.12
            - run: bun install --frozen-lockfile
            - run: bun run lint

    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.12
            - run: bun install --frozen-lockfile
            - run: bun run format:check

    test-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.12
            - run: bun install --frozen-lockfile
            - run: bun run test:backend

    test-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.12
            - run: bun install --frozen-lockfile
            - run: bun run test:frontend

    # Builds both production images on every run (a broken Dockerfile fails
    # here). Pushes to main also publish them to GHCR as
    # ghcr.io/<owner>/fitbond-<image>:<commit sha> and :latest, which the
    # server's scripts/deploy.sh picks up.
    images:
        name: Image ${{ matrix.image }}
        needs: [lint, format, test-backend, test-frontend]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - image: backend
                      dockerfile: apps/backend/Dockerfile
                    - image: web
                      dockerfile: apps/frontend/Dockerfile
        env:
            PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        steps:
            - uses: actions/checkout@v5
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              if: env.PUSH == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Lowercases the owner (GHCR requires it) and adds the OCI labels
            # that link the package to this repo.
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/fitbond-${{ matrix.image }}
                  tags: |
                      type=sha,format=long,prefix=
                      type=raw,value=latest,enable={{is_default_branch}}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: ${{ env.PUSH == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
