# Caddy serving the SPA (apps/frontend/Dockerfile). It proxies /api and
# /uploads to the `backend` Service, like in docker compose. It speaks plain
# HTTP on :80; the Ingress terminates TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: web
    template:
        metadata:
            labels:
                app.kubernetes.io/name: web
        spec:
            containers:
                - name: web
                  image: ghcr.io/matejgalfy/fitbond-web:latest
                  env:
                      - name: SITE_ADDRESS
                        value: ':80'
                  ports:
                      - name: http
                        containerPort: 80
                  readinessProbe:
                      httpGet:
                          path: /
                          port: http
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /
                          port: http
                      periodSeconds: 30
                  resources:
                      requests:
                          cpu: 10m
                          memory: 32Mi
                      limits:
                          memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
    name: web
spec:
    selector:
        app.kubernetes.io/name: web
    ports:
        - name: http
          port: 80
          targetPort: http
